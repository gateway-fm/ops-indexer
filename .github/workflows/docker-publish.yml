name: Docker Publish

# Publishes multi-arch chain-indexer images to GHCR.
#
# Triggers:
#   - Push to main         -> tags :main and :sha-<7>
#   - Push of v* tag       -> tags :<semver> (e.g. v1.2.3) and :latest
#   - workflow_dispatch    -> tags :main and :sha-<7> (same as main push)
#
# Auth: GHCR via GITHUB_TOKEN (OIDC-friendly, no static secrets, no PAT).
# Permissions: contents:read + packages:write at job level (least privilege).
# Multi-arch: linux/amd64 + linux/arm64 (QEMU + buildx).
# Cache: GitHub Actions cache (type=gha, mode=max).
#
# The companion docker-build.yml runs on PRs as a build-only dry run; this
# workflow handles the publish path. Image labels are populated by
# docker/metadata-action so OCI source/revision/version are baked in.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish Indexer Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/gateway-fm/chain-indexer
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Indexer image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
