name: Docker Publish

# Publishes multi-arch chain-indexer images to BOTH GHCR and Docker Hub.
#
# Triggers:
#   - Push to main         -> tag :sha-<7>
#   - Push of v* tag       -> tags :<semver> (e.g. v1.2.3) and :sha-<7>
#   - workflow_dispatch    -> tag :sha-<7> (same as main push)
#
# Only immutable tags are published: full semver and short-sha. Floating
# tags (:latest, :main, :{{major}}, :{{major}}.{{minor}}) are deliberately
# omitted because the Docker Hub repo (gatewayfm/chain-indexer) has tag
# immutability enabled, which rejects any push that would overwrite an
# existing tag. Operators should pin to a specific semver.
#
# Why both registries: Open Privacy Suite and ops-explorer publish to Docker
# Hub under the gatewayfm org; this repo was the odd one out at GHCR.
# Operators pulling the full Open Privacy Suite previously had to log into
# two registries. We keep the GHCR push for backwards compatibility with
# existing Open Privacy Suite compose manifests until they cut over.
#
# Auth:
#   - GHCR     -> GITHUB_TOKEN (OIDC-friendly, no static secrets, no PAT).
#   - Docker Hub -> DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (Docker Hub access
#     token, NOT a GitHub PAT — PATs are blocked org-wide).
#
# Permissions: contents:read + packages:write at job level (least privilege).
# Multi-arch: linux/amd64 + linux/arm64 (QEMU + buildx).
# Cache: GitHub Actions cache (type=gha, mode=max). One build, two pushes.
#
# The companion docker-build.yml runs on PRs as a build-only dry run; this
# workflow handles the publish path. Image labels are populated by
# docker/metadata-action so OCI source/revision/version are baked in.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish Indexer Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Aikido: this job never pushes, so the checkout token is not needed.
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Comma-separated list = same tag suffixes pushed to both registries.
          images: |
            ghcr.io/gateway-fm/chain-indexer
            gatewayfm/chain-indexer
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-

      - name: Build and push Indexer image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
