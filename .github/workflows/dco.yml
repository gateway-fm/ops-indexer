name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-off:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify DCO sign-off trailers
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Dependabot opens automated dependency PRs under the trusted
          # dependabot[bot] identity and cannot certify the DCO, so its own
          # commits are exempt from the sign-off requirement. The exemption is
          # gated on BOTH:
          #   - the PR author (github.event.pull_request.user.login), which is
          #     provided by GitHub and cannot be forged by PR content, so a
          #     human PR cannot bypass DCO by spoofing a commit's author; and
          #   - each commit's own author (checked in the loop below), so human
          #     commits pushed onto a Dependabot PR branch (e.g. conflict fixes)
          #     still require a sign-off.
          # PR_AUTHOR is read via env rather than inline ${{ }} to avoid script
          # injection.
          dependabot_pr=false
          if [ "${PR_AUTHOR:-}" = "dependabot[bot]" ]; then
            dependabot_pr=true
          fi

          base="$(git rev-parse HEAD^1)"
          head="$(git rev-parse HEAD^2)"
          missing=0

          while read -r commit; do
            author_email="$(git show -s --format='%ae' "$commit")"
            author_name="$(git show -s --format='%an' "$commit")"

            # Skip Dependabot's own commits on a Dependabot PR (see rationale
            # above). Human commits on the same PR fall through and are checked.
            if [[ "$dependabot_pr" == "true" && "$author_name" == "dependabot[bot]" && "$author_email" == *"dependabot[bot]"*@users.noreply.github.com ]]; then
              echo "Skipping DCO check for Dependabot commit $(git rev-parse --short "$commit")"
              continue
            fi

            if ! git log -1 --format=%B "$commit" |
              git interpret-trailers --parse |
              awk -v email="<$author_email>" '
                BEGIN { found = 0 }
                tolower($0) ~ /^signed-off-by:/ && index(tolower($0), tolower(email)) > 0 { found = 1 }
                END { exit found ? 0 : 1 }
              '; then
              short="$(git rev-parse --short "$commit")"
              echo "::error title=Missing DCO sign-off::commit ${short} lacks a Signed-off-by trailer for ${author_email}"
              missing=1
            fi
          done < <(git rev-list --reverse --no-merges "$base..$head")

          if [ "$missing" -ne 0 ]; then
            echo "Every non-merge commit must include a Signed-off-by trailer."
            echo "Use git commit -s, or amend with git commit --amend -s."
            exit 1
          fi
