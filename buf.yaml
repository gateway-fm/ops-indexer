version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Simple Get RPCs return the entity directly (not a Get*Response wrapper).
    # Adding a wrapper is future-proof-friendly but adds no semantic value for
    # point reads. If we ever need to add extra fields alongside an entity in
    # a response, we add a v2 RPC with the wrapper at that point.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # v1 is explicit in the package name.
    - PACKAGE_VERSION_SUFFIX
breaking:
  use:
    - FILE
