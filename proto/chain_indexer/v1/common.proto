syntax = "proto3";

package chain_indexer.v1;

option go_package = "github.com/gateway-fm/chain-indexer/gen/go/chain_indexer/v1;indexerv1";

import "google/protobuf/timestamp.proto";

// ----- Pagination -----
//
// Cursor pagination is the default. Cursors are opaque strings the server
// encodes; clients send them back verbatim. Page size is capped server-side.
// Empty next_cursor means end of stream.

// PageRequest is embedded in List/Range requests.
message PageRequest {
  // Max items to return in a page. Server-capped (see docs/API.md).
  // If 0, server default is used.
  int32 page_size = 1;

  // Opaque cursor returned from a previous page's next_cursor.
  // Empty string = first page.
  string cursor = 2;
}

// PageResponse is embedded in List/Range responses.
message PageResponse {
  // Opaque cursor to pass back for the next page.
  // Empty = no more pages.
  string next_cursor = 1;
}

// OffsetPageRequest is used only for bounded browse endpoints where offset
// pagination is acceptable (see docs/API.md). Prefer cursor pagination.
message OffsetPageRequest {
  int32 page_size = 1;
  // 1-based page number. page=0 is treated as page=1.
  int32 page = 2;
}

message OffsetPageResponse {
  int32 page = 1;
  int32 page_size = 2;
  int64 total_items = 3;
}

// ----- Ranges -----

// BlockRange is a half-open [start, end) interval over block numbers.
// Either bound may be unset (0) to mean "unbounded on that side".
message BlockRange {
  uint64 from_block = 1;  // inclusive; 0 = no lower bound
  uint64 to_block = 2;    // exclusive; 0 = no upper bound (= latest)
}

// TimeRange is a half-open [start, end) interval.
// Either bound may be unset.
message TimeRange {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

// ----- Scalars -----
//
// Addresses and hashes are lowercase hex strings with 0x prefix.
// Big numeric values (wei, gas prices) are decimal strings to avoid int64
// overflow. See docs/API.md for exact conventions.

// BigInt is a decimal string representation of an unbounded integer.
// Examples: "0", "1000000000000000000", "115792089237316195423570985008687907853269984665640564039457584007913129639935"
message BigInt {
  string value = 1;
}

// ----- Empty -----

// Empty is a request/response for RPCs that take or return no data.
message Empty {}
