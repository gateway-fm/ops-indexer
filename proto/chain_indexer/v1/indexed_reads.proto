syntax = "proto3";

package chain_indexer.v1;

option go_package = "github.com/gateway-fm/chain-indexer/gen/go/chain_indexer/v1;indexerv1";

import "chain_indexer/v1/common.proto";

// Bounded fixed-purpose reads. This service exposes chain facts, never SQL,
// viewer authority or OPS credentials. Handles own a single original budget
// and deadline; no database transaction remains open between RPCs.
service IndexedReadService {
  rpc GetSource(Empty) returns (IndexedSource);
  rpc OpenCohort(OpenCohortRequest) returns (OpenCohortResponse);
  rpc RecheckCohort(IndexedHandleRequest) returns (Empty);
  rpc OpenProtected(OpenProtectedRequest) returns (IndexedHandle);
  rpc ReadDestinations(IndexedHandleRequest) returns (IndexedDestinations);
  rpc ReadWitnesses(IndexedWitnessRequest) returns (IndexedWitnesses);
  rpc ReadTransactions(IndexedTransactionsRequest) returns (IndexedTransactions);
  rpc RecheckProtected(IndexedHandleRequest) returns (Empty);
  rpc Close(IndexedHandleRequest) returns (Empty);
}

message IndexedExpectedSource {
  string source_reference = 1;
  string configured_epoch = 2;
  string schema_digest = 3;
  string chain_id = 4;
  string genesis_hash = 5;
}

message IndexedSource {
  IndexedExpectedSource binding = 1;
  bytes instance_id = 2; // Exactly 32 random bytes, new for every service start.
  bool ready = 3;
}

message IndexedHandle {
  bytes instance_id = 1;
  bytes id = 2; // Exactly 32 random bytes; one typed purpose, never permission.
}

message IndexedHandleRequest { IndexedHandle handle = 1; }
message IndexedAnchor { uint64 number = 1; string hash = 2; }
message IndexedPosition {
  uint64 block = 1;
  uint32 index = 2;
  string hash = 3;
  string subkey = 4;
  string amount = 5;
}

// Family is the closed set accepted by the existing fixed read contract:
// blocks, transactions, transfers, internals, logs, tokens, balances, holders,
// contracts, addresses, sync, progress, search. No SQL names/expressions.
message IndexedQuery {
  string family = 1;
  string address = 2;
  string hash = 3;
  string token = 4;
  string topic0 = 5;
  string search = 6;
  optional uint64 block = 7;
  optional uint64 from = 8;
  optional uint64 through = 9;
  IndexedAnchor upper = 10;
  IndexedPosition after = 11;
  uint32 raw_limit = 12;
}

// json contains only the existing fixed-family lossless fact projection.
// It is bounded data, never an input query or an extensible column selector.
message IndexedRecord {
  string family = 1;
  string key = 2;
  IndexedPosition position = 3;
  bytes json = 4;
}
message IndexedCohort {
  IndexedAnchor upper = 1;
  repeated IndexedRecord rows = 2;
  repeated IndexedRecord context = 3;
  bool exhausted = 4;
}
message OpenCohortRequest {
  IndexedExpectedSource expected = 1;
  IndexedQuery query = 2;
}
message OpenCohortResponse {
  IndexedHandle handle = 1;
  IndexedQuery query = 2; // Original normalized query with resolved upper.
  IndexedCohort data = 3;
}

message IndexedProtectedSelection {
  repeated bytes targets = 1; // Sorted unique 20-byte raw addresses, <=4096.
  uint64 from_time = 2;
  uint64 through_time = 3;
  uint64 from_number = 4;
  uint64 through_number = 5;
}
message OpenProtectedRequest {
  IndexedExpectedSource expected = 1;
  IndexedProtectedSelection selection = 2;
}
message IndexedProtectedPosition {
  uint64 number = 1;
  uint32 index = 2;
  bytes hash = 3; // Exactly32 bytes.
}
message IndexedProtectedRow {
  IndexedProtectedPosition position = 1;
  bytes block_hash = 2;
  uint64 timestamp = 3;
  bytes from = 4;
  optional bytes to = 5;
}
message IndexedDestinations {
  repeated bytes addresses = 1;
  optional uint64 first = 2;
  optional uint64 last = 3;
}
message IndexedInterval {
  bytes address = 1;
  uint64 from_number = 2;
  uint32 from_index = 3;
  uint64 before_number = 4;
  uint32 before_index = 5;
}
message IndexedCreation {
  bytes address = 1;
  IndexedProtectedPosition position = 2;
}
message IndexedPredicate {
  repeated IndexedInterval intervals = 1;
  repeated IndexedCreation creations = 2;
}
message IndexedTransactionQuery {
  optional bytes address = 1;
  optional bytes hash = 2;
  IndexedProtectedPosition after = 3;
  uint32 limit = 4;
}
message IndexedWitnessRequest {
  IndexedHandle handle = 1;
  IndexedPredicate predicate = 2;
}
message IndexedWitness {
  bytes address = 1;
  IndexedProtectedRow row = 2;
}
message IndexedWitnesses { repeated IndexedWitness witnesses = 1; }
message IndexedTransactionsRequest {
  IndexedHandle handle = 1;
  IndexedPredicate predicate = 2;
  IndexedTransactionQuery query = 3;
}
message IndexedTransactions {
  repeated IndexedProtectedRow rows = 1;
  bool exhausted = 2;
}
